    <div class="modal fade" id="addEventModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">일정 추가</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form method="POST" th:action="@{/api/events}" id="addEventForm">
                        <div class="mb-3">
                            <label for="eventTitle" class="form-label">일정 제목</label>
                            <input type="text" class="form-control" id="eventTitle" name="title" required>
                        </div>
                        <div class="mb-3">
                            <label for="eventStartDate" class="form-label">시작일</label>
                            <input type="date" class="form-control" id="eventStartDate" name="start" required>
                        </div>
                        <div class="mb-3">
                            <label for="eventEndDate" class="form-label">종료일</label>
                            <input type="date" class="form-control" id="eventEndDate" name="end" required>
                        </div>
                        <input type="submit" value="new event"/>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                    <button type="button" class="btn btn-primary" id="saveEventBtn">저장</button>
                </div>
            </div>
        </div>
    </div>
