<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{default}">

<head>
    <title>게시글을 찾을 수 없음</title>
</head>

<body>
<div layout:fragment="content" class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="alert alert-danger p-5" role="alert">
                <h4 class="alert-heading">페이지를 찾을 수 없습니다</h4>
                <hr>
                <!-- PostService에서 전달한 메시지를 표시합니다. -->
                <p class="mb-0 fs-5" th:text="${message}">요청하신 게시글을 찾을 수 없습니다.</p>
            </div>
            <a th:href="@{/board}" class="btn btn-primary mt-4">게시글 목록으로 돌아가기</a>
        </div>
    </div>
</div>
</body>

</html>
