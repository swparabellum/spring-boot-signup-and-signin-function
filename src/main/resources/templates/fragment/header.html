<header th:fragment="header" class="shadow-sm" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
    <div class="container text-center mb-3">
        <div sec:authorize="isAuthenticated()">
            <div class="row">
                <div class="col">
                    <div sec:authentication="name"></div>
                </div>
                <div class="col">

                    <a class="btn btn-primary" href="/newPost">게시글작성(추후 깔끔하게 다듬을것)</a>
                </div>
                <div class="col">
                    <a class="btn btn-primary" href="/accountManage">계정관리(추후 깔끔하게 다듬을것)</a>
                </div>
                <div class="col">
                    <form th:action="@{/logout}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-primary">로그아웃</button>
                    </form>
                </div>
            </div>
        </div>
        <div sec:authorize="isAnonymous()">
            <div class="row">
                <div class="col">
                    로그인을 해주세요.
                </div>
                <div class="col">
                    <a class="btn btn-primary" href="/login">로그인</a>
                    <a class="btn btn-primary" href="/signup">회원가입</a>
                </div>
            </div>
        </div>
    </div>
</header>
