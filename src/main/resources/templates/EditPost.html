<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{default}">

<head>
  <title>Edit Post</title>
</head>

<body>
<div layout:fragment="content" class="container">
  <h1>new Post</h1>
  <form method="POST" th:action="@{/EditPost}" id="EditPostForm">
    <div class="form-group">
      <input type="hidden" id="id" name="id" th:value="${post.boardId}" />
      <label for="title">title </label>
      <input id="title" name="title" class="form-control" th:value="${post.title}" />
    </div>
    <div class="form-group mb-3">
      <label for="content"> </label>
      <textarea class="form-control" id="content" name="content" rows="5" th:text="${post.content}"></textarea>
    </div>
    <input class="btn btn-primary" type="submit" value="수정" />
  </form>
</div>
</body>

</html>
